<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cent Loansetu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div class="app-container">
        <!-- MAIN CHAT SCREEN -->
        <main class="main-content" id="main-content">
            <!-- CHAT HEADER (WhatsApp Action Bar) -->
            <header class="chat-header">
                <div class="chat-header-left">
                    <div class="avatar bot-avatar header-avatar">LS</div>
                    <div class="chat-meta">
                        <h2 class="chat-name">Cent Loansetu</h2>
                        <span class="chat-status">online</span>
                    </div>
                </div>
                
                <div class="chat-header-actions">
                    <!-- Theme Toggle -->
                    <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                        <!-- Loaded dynamically by JS -->
                    </button>
                    <!-- New Chat/Session -->
                    <button class="icon-btn" onclick="startNewChat()" title="New Session">
                        <svg viewBox="0 0 24 24" width="20" height="20" class="svg-icon">
                            <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- CHAT BODY (WhatsApp Scrollable Pane) -->
            <div class="chat-body" id="chat-body">
                <div class="chat-wallpaper"></div>
                
                <!-- Encryption Notice -->
                <div class="system-message">
                    <span>🔒 Messages are encrypted. This portal is configured for internal use on CENT HOTEL Scheme Circular (No. 4114).</span>
                </div>

                <div id="messages" class="messages-container"></div>
            </div>

            <!-- CHAT INPUT FOOTER (WhatsApp Text Bar) -->
            <footer class="chat-footer">
                <div class="input-container">
                    <input id="msg" type="text" placeholder="Type a message" autocomplete="off">
                </div>
                
                <div class="send-action">
                    <!-- Circular Floating Button -->
                    <button id="send" class="send-circle-btn">
                        <!-- Send Arrow SVG -->
                        <svg id="send-icon" viewBox="0 0 24 24" width="20" height="20" class="svg-icon">
                            <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </footer>
        </main>
    </div>
    <script src="chat.js"></script>
</body>
</html>
